name: TerraSeek CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]'
      - run: ruff check terraseek/jobs.py terraseek/providers.py terraseek/storage.py terraseek/models.py terraseek/routes.py terraseek/services.py tests/test_api.py tests/test_services.py
      - run: ruff format --check terraseek/jobs.py terraseek/providers.py terraseek/storage.py terraseek/models.py terraseek/routes.py terraseek/services.py tests/test_api.py tests/test_services.py
      - run: pytest -q

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check frontend/js/app.js
      - run: node --check server.js
